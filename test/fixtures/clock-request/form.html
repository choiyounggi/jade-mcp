function doValidation()
{
  var return_result;
  inputAutoUnformat("f1");

  setYmd();

  if( ! checkForm("f1") )
  {
    return false;
  }

  if( !$("#S_WORK_YMD").val() )
  {
    alert(ajaxMsg("jade_ent_work_day", "ko"));
    return false;
  }

  if( $("#S_WORK_YMD").val() > "20261103" )
  {
    if("ko" == "ko") alert(" 출퇴근시각변경신청은 현재일(" + formatValue("20261103", "dfDateYmd") + ")을 포함한 과거일자 근무일만 신청가능합니다. ");
    else if("ko" == "ko") alert("You can apply only for past working days, including the current date (" + formatValue("20261103", "dfDateYmd") + ")");
    else alert("You can apply only for past working days, including the current date (" + formatValue("20261103", "dfDateYmd") + ")");
    return false;
  }

  if( !$("#S_STA_YMD_CLASS").val() || !$("#S_END_YMD_CLASS").val() )
  {
    alert(ajaxMsg("jade_ent_day_class", "ko"));
    return false;
  }

  if( $('#S_IN_OUT_CLASS').val () == 30 )
  {
    if( $("#S_STA_YMD").val()+""+$("#S_STA_HM").val() > $("#S_END_YMD").val()+""+$("#S_END_HM").val() )
    {
      alert(ajaxMsg("jade_time_validate_alert", "ko"));
      return false;
    }
  }
  if( !doAction2("tok-27xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx") )
  {
    return false;
  }

  // -a , +a 체크
  // 출근 or 퇴근 일때만
  //if( _plan_chk_yn != "pass" ) //계획체크여부가 'N' 인데 계획이 없으면 해당로직 안타도록 처리
  //{
    if( !doAction2("tok-28xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx") )
    {
      return false;
    }
  //}

  return true;
}

function doAction2(sAction, p1)
{
  inputAutoUnformat("f1");
  $("#S_DSMETHOD").val(sAction);

  switch(sAction)
  {
    case "tok-29xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx":
    {
      $("#S_BEF_TARGET_EMP_ID").val( $("#S_TARGET_EMP_ID").val() );
      Apply.changeTRG();
    }
    break;
    
    case "tok-23xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx":
    {
      if( isDisabled ) return;

      $("#S_WORK_CLASS").val("");
      if( $("#S_TARGET_EMP_ID").val() == "" || $("#S_WORK_YMD").val() == "" || $("#S_WORK_YMD").val().length != 8 )
      {
        return;
      }
      ajaxSyncRequestXS($("#S_DSCLASS").val(), "tok-23xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx", serializeForm("f1"), function(xs)
      {
        $("#S_WORK_TYPE").val(xs.GetEtcData("WORK_TYPE"));
        $("#S_WORK_TYPE_CD").val(xs.GetEtcData("WORK_TYPE_CD"));
        _plan_chk_yn = "";

        //환경변수 계획체크여부가 'Y" 일떄만 체크하도록 함
        //null 인경우는 근무조없는경우이므로 신청불가하도록 처리
        if( !xs.GetEtcData("PLAN_CHK_YN") )
        {
          alert(ajaxMsg("jade_shift_not_exist", "ko"));
        }

        if( xs.GetEtcData("PLAN_CHK_YN") == "Y" )
        {
          if( xs.GetEtcData("P_IN_HM") == "" || xs.GetEtcData("P_OUT_HM") == "" )
          {
            alert(ajaxMsg("jade_plan_time_not_exist", "ko"));
            inputSetValueAuto("F_WORK_YMD", "");
            
              $("#divAttendTxt").val("");
            
          }
        }
        else
        {
          if( xs.GetEtcData("P_IN_HM") == "" || xs.GetEtcData("P_OUT_HM") == "" )
          {
            _plan_chk_yn = "pass";
          }
        }
      });

      doAction2("tok-26xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"); 
    }
    break;
    
    case "tok-26xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx":
    {
      var attendHtml = "";

      $("#S_WORK_CLASS").val("");
      if( $("#S_TARGET_EMP_ID").val() == "" || $("#S_WORK_YMD").val() == "" || $("#S_WORK_YMD").val().length != 8 )
      {
        return;
      }

      ajaxSyncRequestXS($("#S_DSCLASS").val(), "tok-26xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx", serializeForm("f1"), function(xs)
      {
        if( xs.GetEtcData("ATTEND_TXT") ) attendHtml += xs.GetEtcData("ATTEND_TXT").trim().replace(/^,+/, "").replace(/,$/, "");
      });

      
        $("#divAttendTxt").val(attendHtml.trim());
      
      
    }
    break;
    
    /*
    case "tok-27xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" :
    {
      var result;

      ajaxSyncRequestXS($("#S_DSCLASS").val(), $("#S_DSMETHOD").val(), serializeForm("f1"), function(xs)
      {
        if( xs.RowCount() > 0 )
        {
          if( xs.GetCellValue(0, "CHK_MSG") == "OK" )
          {
            result = true;
          }
          else
          {
            alert(xs.GetCellValue(0, "CHK_MSG"));
            result = false;
          }
        }
      });

      return result;
    }
    break;
    */
    case "tok-27xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" :
    {
      var result = true;
      var alert_msg = "";
      ajaxSyncRequestXS($("#S_DSCLASS").val(), $("#S_DSMETHOD").val(), serializeForm("f1"), function(xs)
      {
        S_ERRORCODE = xs.GetEtcData("ERRORCODE");

        if (S_ERRORCODE != '0')
        {
           alert_msg += "▶" + S_ERRORMESG + "\n\n";

        }

        alert(alert_msg);
      }

    }
    
    case "tok-28xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" :
    {
      var result = true;

      // -a , +a 체크
      // 출근 or 퇴근 일때만
      if( $('#S_IN_OUT_CLASS').val() == '10' || $('#S_IN_OUT_CLASS').val() == '20' )
      {

function getInOutCalcUnit(hm, round, unit, inout)
{	
  var h = hm.substr(0, 2);
  var m = hm.substr(3, 2);
  
  if(h < 0 || h >= 24 || m <= 0 || m >= 60)
    return 0;
  
  switch (round)
  {
    case '올림':
    {
	  if( m % unit != 0 )
	    m = Math.floor( m / unit + 1) * unit;
	  else
		return 0;
    }
    break;
    case '버림':
    {
      if( m % unit != 0 )
    	m = Math.floor( m / unit ) * unit;
      else
    	return 0;
    }
    break;
  }
  
  if(m >= 60)
	hm = lpad(( Number(hm.substr(0, 2)) + Number(1) ) + '00', 4, 0);
  else
	hm = rpad(hm.substr(0, 2) + m, 4, 0);
  
  h = hm.substr(0,2);
  if(h >= 24)
  {
	if(inout == 'STA')
	{
	  setSelect("S_STA_YMD_CLASS", 3);
	}
	else
	{
	  setSelect("S_END_YMD_CLASS", 3);
	}
	
	hm = '0000';
  }
  
  return hm;
}

function lpad(val, padLength, padString){
    while(val.length < padLength){
        val = padString + val;
    }
    return val;
}

function rpad(val, padLength, padString){
    while(val.length < padLength){
        val += padString;
    }
    return val;
}
